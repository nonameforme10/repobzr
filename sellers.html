<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Bazar — Seller Point of Sale Terminal. Fast, responsive, offline-first product checkout and sales tracking.">
<meta name="theme-color" content="#FAF8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0D0B" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Bazar — Seller POS</title>
<script>
  // Domain access guard: ensure sellers POS is only viewed on sellers.caretrack.website or local dev
  (function () {
    var h = window.location.hostname;
    var isAllowed = !h || h === 'sellers.caretrack.website' || h === 'localhost' || h === '127.0.0.1' || h.endsWith('.local') || h.endsWith('.vercel.app');
    if (!isAllowed) {
      window.location.replace('/404.html');
      return;
    }
  })();

  (function () {
    try {
      var saved = localStorage.getItem('salestrack-theme');
      var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (systemDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
<link rel="stylesheet" href="/style.css?v=4">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ── POS SPECIFIC COMPONENT STYLING (THEME-ALIGNED) ── */

  .pos-layout {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg-app);
    color: var(--ink);
  }

  /* ── HEADER ── */
  .pos-header {
    background: var(--bg-topbar);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .brand-logo {
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    object-fit: cover;
    box-shadow: var(--shadow-xs);
  }

  .brand-title {
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--ink-strong);
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent-strong);
    background: var(--accent-soft);
    border: 1px solid var(--accent-ring);
    padding: 2px 8px;
    border-radius: var(--radius-pill);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-stats-cluster {
    display: flex;
    align-items: center;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 14px;
    gap: 14px;
    box-shadow: var(--shadow-xs);
  }

  .header-stat {
    display: flex;
    flex-direction: column;
    text-align: right;
  }

  .header-stat .val {
    font-size: 0.9375rem;
    font-weight: 700;
    color: var(--ink-strong);
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }

  .header-stat .val.profit-val {
    color: var(--success);
  }

  .header-stat .lbl {
    font-size: 0.6875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--ink-muted);
    margin-top: 1px;
  }

  .header-stat-divider {
    width: 1px;
    height: 24px;
    background: var(--divider);
  }

  /* ── TOOLBAR ── */
  .pos-toolbar {
    max-width: 1440px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 28px 0;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .pos-search-box {
    position: relative;
    display: flex;
    align-items: center;
    flex: 1;
    min-width: 240px;
    max-width: 380px;
  }

  .pos-search-box svg {
    position: absolute;
    left: 12px;
    color: var(--ink-muted);
    pointer-events: none;
    stroke: var(--ink-muted);
  }

  .pos-search-input {
    width: 100%;
    padding: 9px 14px 9px 38px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    color: var(--ink-strong);
    font-family: inherit;
    outline: none;
    transition: var(--transition-fast);
  }

  .pos-search-input::placeholder {
    color: var(--ink-muted);
  }

  .pos-search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }

  .pos-filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pos-filter-btn {
    padding: 8px 14px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--ink-subtle);
    font-size: 0.8125rem;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: var(--transition-fast);
    white-space: nowrap;
    touch-action: manipulation;
  }

  .pos-filter-btn:hover {
    border-color: var(--border-strong);
    color: var(--ink-strong);
  }

  .pos-filter-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent-strong);
    font-weight: 600;
  }

  .toolbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  .count-pill {
    padding: 5px 12px;
    background: var(--bg-surface-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-pill);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }

  /* ── GRID ── */
  .pos-grid-container {
    max-width: 1440px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 28px 48px;
    flex: 1;
  }

  .pos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }

  /* ── PRODUCT CARD ── */
  .pos-card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: var(--transition);
    box-shadow: var(--shadow-xs);
    position: relative;
  }

  .pos-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-md);
    transform: translateY(-2px);
  }

  .pos-card.out-of-stock {
    opacity: 0.65;
  }

  .pos-card-img-wrap {
    aspect-ratio: 16/10;
    overflow: hidden;
    position: relative;
    background: var(--bg-surface-2);
  }

  .pos-card-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
  }

  .pos-card:hover .pos-card-img {
    transform: scale(1.03);
  }

  .card-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 3px 9px;
    border-radius: var(--radius-pill);
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    box-shadow: var(--shadow-xs);
    backdrop-filter: blur(4px);
    z-index: 2;
  }

  .badge-low {
    background: var(--warning-soft);
    color: var(--warning);
    border: 1px solid rgba(166, 101, 26, 0.25);
  }

  .badge-out {
    background: var(--danger-soft);
    color: var(--danger);
    border: 1px solid rgba(178, 59, 59, 0.25);
  }

  .badge-new {
    background: var(--accent-soft);
    color: var(--accent-strong);
    border: 1px solid var(--accent-ring);
  }

  /* Card sync pill indicator */
  .sync-indicator {
    display: none;
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 3px 9px;
    border-radius: var(--radius-pill);
    font-size: 0.6875rem;
    font-weight: 600;
    gap: 5px;
    align-items: center;
    box-shadow: var(--shadow-xs);
    backdrop-filter: blur(6px);
    z-index: 2;
  }

  .sync-indicator.visible {
    display: flex;
  }

  .sync-saved {
    background: var(--accent-soft);
    color: var(--accent-strong);
    border: 1px solid var(--accent-ring);
  }

  .sync-syncing {
    background: var(--info-soft);
    color: var(--info);
    border: 1px solid rgba(30, 79, 168, 0.25);
  }

  .sync-synced {
    background: var(--success-soft);
    color: var(--success);
    border: 1px solid rgba(21, 128, 61, 0.25);
  }

  .sync-failed {
    background: var(--danger-soft);
    color: var(--danger);
    border: 1px solid rgba(178, 59, 59, 0.25);
  }

  .pos-card-body {
    padding: 16px 16px 0;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .pos-card-name {
    font-weight: 600;
    font-size: 0.9375rem;
    line-height: 1.35;
    color: var(--ink-strong);
    margin-bottom: 2px;
    letter-spacing: -0.01em;
  }

  .pos-card-sku {
    font-size: 0.6875rem;
    color: var(--ink-muted);
    font-weight: 500;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }

  .pos-card-meta {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .pos-meta-tag {
    padding: 2px 7px;
    background: var(--bg-surface-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-xs);
    font-size: 0.6875rem;
    color: var(--ink-subtle);
    font-weight: 500;
  }

  .pos-meta-tag.category {
    background: var(--accent-soft);
    border-color: transparent;
    color: var(--accent-strong);
    font-weight: 600;
    border-radius: var(--radius-pill);
  }

  .pos-card-price-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--divider);
    margin-top: auto;
  }

  .pos-card-price {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--ink-strong);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .pos-card-stock {
    font-size: 0.75rem;
    color: var(--ink-muted);
    font-weight: 500;
    text-align: right;
  }

  .pos-card-stock .stock-num {
    font-size: 1rem;
    font-weight: 700;
    color: var(--ink-strong);
    display: block;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }

  .pos-card-stock.stock-low .stock-num {
    color: var(--warning);
  }

  .pos-card-stock.stock-out .stock-num {
    color: var(--danger);
  }

  .pos-card-stock.stock-untracked .stock-num {
    color: var(--ink-muted);
  }

  .pos-card-footer {
    padding: 12px 16px 16px;
  }

  .sold-btn {
    width: 100%;
    padding: 10px 16px;
    background: var(--accent);
    color: var(--ink-invert);
    border: none;
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: var(--transition-fast);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    touch-action: manipulation;
    box-shadow: 0 1px 2px rgba(184, 134, 11, 0.25);
  }

  [data-theme="dark"] .sold-btn {
    color: #0E0D0B;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }

  .sold-btn:hover:not(:disabled) {
    background: var(--accent-strong);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(184, 134, 11, 0.35);
  }

  .sold-btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .sold-btn:disabled {
    background: var(--border);
    color: var(--ink-faint);
    cursor: not-allowed;
    box-shadow: none;
    opacity: 0.65;
  }

  .sold-btn svg {
    flex-shrink: 0;
  }

  /* ── MODAL OVERLAY ── */
  .pos-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26, 32, 29, 0.45);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    transition: opacity 180ms ease;
  }

  [data-theme="dark"] .pos-overlay {
    background: rgba(0, 0, 0, 0.65);
  }

  .pos-overlay.open {
    display: flex;
    opacity: 1;
  }

  .pos-modal {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 440px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    transform: scale(0.96) translateY(8px);
    transition: transform 220ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  .pos-overlay.open .pos-modal {
    transform: scale(1) translateY(0);
  }

  .pos-modal-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--divider);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .pos-modal-title {
    font-size: 1.0625rem;
    font-weight: 700;
    color: var(--ink-strong);
    letter-spacing: -0.01em;
  }

  .pos-modal-sub {
    font-size: 0.75rem;
    color: var(--ink-muted);
    margin-top: 3px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  .pos-modal-close {
    width: 32px;
    height: 32px;
    border: none;
    background: var(--bg-surface-2);
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-muted);
    flex-shrink: 0;
    font-size: 16px;
    transition: var(--transition-fast);
    font-family: inherit;
  }

  .pos-modal-close:hover {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .pos-modal-body {
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  .field-label {
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    margin-bottom: 8px;
  }

  /* Quantity Control */
  .qty-control {
    display: flex;
    align-items: center;
    background: var(--bg-surface-2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    transition: var(--transition-fast);
  }

  .qty-control:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }

  .qty-control.error {
    border-color: var(--danger);
  }

  .qty-btn {
    width: 44px;
    height: 44px;
    border: none;
    background: transparent;
    font-size: 20px;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    transition: var(--transition-fast);
    flex-shrink: 0;
  }

  .qty-btn:hover:not(:disabled) {
    background: var(--accent-soft);
    color: var(--accent-strong);
  }

  .qty-btn:active:not(:disabled) {
    background: var(--accent-ring);
  }

  .qty-btn:disabled {
    color: var(--ink-faint);
    cursor: not-allowed;
  }

  .qty-input {
    flex: 1;
    text-align: center;
    border: none;
    background: transparent;
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--ink-strong);
    font-family: inherit;
    outline: none;
    min-width: 0;
    padding: 0 4px;
    font-variant-numeric: tabular-nums;
  }

  .qty-input::-webkit-inner-spin-button,
  .qty-input::-webkit-outer-spin-button {
    -webkit-appearance: none;
  }

  .qty-warn {
    font-size: 0.75rem;
    color: var(--warning);
    margin-top: 6px;
    display: none;
    align-items: center;
    gap: 6px;
    font-weight: 500;
  }

  .qty-warn.visible {
    display: flex;
  }

  /* Price Input */
  .price-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .price-symbol {
    position: absolute;
    left: 14px;
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--ink-muted);
    pointer-events: none;
  }

  .price-input {
    width: 100%;
    padding: 10px 14px 10px 32px;
    background: var(--bg-input);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--ink-strong);
    font-family: inherit;
    outline: none;
    transition: var(--transition-fast);
    font-variant-numeric: tabular-nums;
  }

  .price-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }

  .price-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
  }

  /* Summary Panel */
  .summary {
    background: var(--bg-surface-2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .summary-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.8125rem;
  }

  .summary-row .s-label {
    color: var(--ink-muted);
    font-weight: 500;
  }

  .summary-row .s-val {
    font-weight: 600;
    color: var(--ink-strong);
    font-variant-numeric: tabular-nums;
  }

  .summary-divider {
    height: 1px;
    background: var(--divider);
    margin: 4px 0;
  }

  .summary-profit {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    margin-top: 4px;
    font-size: 0.875rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    transition: var(--transition-fast);
  }

  .summary-profit.profit {
    background: var(--success-soft);
    color: var(--success);
  }

  .summary-profit.discount {
    background: var(--danger-soft);
    color: var(--danger);
  }

  .summary-profit.even {
    background: var(--border-soft);
    color: var(--ink-muted);
    font-weight: 600;
  }

  /* Modal Footer */
  .pos-modal-footer {
    padding: 16px 22px 20px;
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--divider);
    background: var(--bg-surface-2);
  }

  .btn-cancel {
    flex: 1;
    padding: 11px 16px;
    background: var(--bg-surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    transition: var(--transition-fast);
    touch-action: manipulation;
  }

  .btn-cancel:hover {
    background: var(--bg-surface-2);
    border-color: var(--ink-muted);
  }

  .btn-confirm {
    flex: 1.5;
    padding: 11px 16px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--ink-invert);
    cursor: pointer;
    font-family: inherit;
    transition: var(--transition-fast);
    touch-action: manipulation;
    box-shadow: 0 1px 2px rgba(184, 134, 11, 0.25);
  }

  [data-theme="dark"] .btn-confirm {
    color: #0E0D0B;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }

  .btn-confirm:hover:not(:disabled) {
    background: var(--accent-strong);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(184, 134, 11, 0.35);
  }

  .btn-confirm:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn-confirm:disabled {
    background: var(--border-strong);
    color: var(--ink-faint);
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ── TOAST NOTIFICATIONS ── */
  .pos-toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
    max-width: 360px;
    width: calc(100% - 48px);
  }

  .pos-toast {
    background: var(--bg-surface);
    color: var(--ink-strong);
    padding: 14px 16px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    font-size: 0.8125rem;
    font-weight: 500;
    line-height: 1.4;
    animation: toast-in 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    align-items: flex-start;
    gap: 12px;
    pointer-events: all;
    border-left: 3.5px solid var(--accent);
  }

  .pos-toast.profit-toast { border-left-color: var(--success); }
  .pos-toast.warn-toast   { border-left-color: var(--warning); }
  .pos-toast.error-toast  { border-left-color: var(--danger); }

  @keyframes toast-in {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .toast-icon {
    font-size: 16px;
    flex-shrink: 0;
    margin-top: 1px;
    font-weight: 700;
  }

  .profit-toast .toast-icon { color: var(--success); }
  .warn-toast .toast-icon { color: var(--warning); }
  .error-toast .toast-icon { color: var(--danger); }

  .toast-body .toast-title {
    font-weight: 600;
    color: var(--ink-strong);
    margin-bottom: 2px;
  }

  .toast-body .toast-detail {
    color: var(--ink-muted);
    font-size: 0.75rem;
  }

  /* ── EMPTY STATE ── */
  .pos-empty {
    grid-column: 1 / -1;
    padding: 64px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

  .pos-empty-icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin-bottom: 14px;
    border: 1px solid var(--accent-ring);

  .pos-empty-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--ink-strong);
    margin-bottom: 4px;
  }

  .pos-empty-sub {
    font-size: 0.8125rem;
    color: var(--ink-muted);
  }

  /* ── MOBILE RESPONSIVENESS ── */
  @media (max-width: 680px) {
    .pos-header {
      padding: 0 16px;
      height: 60px;
    }
    .header-stat:first-child {
      display: none;
    }

    .pos-grid {
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));

    }
    .pos-card-price {

    .pos-overlay {
      padding: 0;

    .pos-modal {
      max-width: 100%;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;

    .pos-toast-container {

      max-width: 100%;
    }
  }
</style>
</head>

<!-- TOAST CONTAINER -->

<script>
// ── CONSTANTS & DB ────────────────────────────────────────────────────────
const DB_NAME = 'SalesTrackDB';
const DB_VERSION = 1;
const API_BASE_URL = (typeof window !== 'undefined' && window.SALESTRACK_API_URL) || '/api';

const localDb = {
  db: null,
  async init() {
    return new Promise((resolve) => {
      if (this.db) return resolve(this.db);
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('categories')) db.createObjectStore('categories', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('products')) db.createObjectStore('products', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('activities')) db.createObjectStore('activities', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
        if (!db.objectStoreNames.contains('outbox')) {
          const outboxStore = db.createObjectStore('outbox', { keyPath: 'id' });
          outboxStore.createIndex('status', 'status', { unique: false });
        }
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
      };
      req.onsuccess = (e) => {
        this.db = e.target.result;
        resolve(this.db);
      };
      req.onerror = (e) => {
        console.error('[pos idb] Failed to open IndexedDB:', e.target.error);
        resolve(null);
      };
    });
  },

  async getAll(storeName) {
    if (!this.db) return [];
    return new Promise((resolve) => {
      try {
        const tx = this.db.transaction(storeName, 'readonly');
        const store = tx.objectStore(storeName);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      } catch (e) { resolve([]); }
    });
  },

  async put(storeName, value) {
    if (!this.db) return;
    return new Promise((resolve) => {
      try {
        const tx = this.db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        store.put(value);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      } catch (e) { resolve(); }
    });
  },

  async putAll(storeName, items) {
    if (!this.db || !Array.isArray(items)) return;
    return new Promise((resolve) => {
      try {
        const tx = this.db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        for (const item of items) store.put(item);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      } catch (e) { resolve(); }
    });
  },

  async delete(storeName, key) {
    if (!this.db) return;
    return new Promise((resolve) => {
      try {
        const tx = this.db.transaction(storeName, 'readwrite');
        const store = tx.objectStore(storeName);
        store.delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      } catch (e) { resolve(); }
    });
  },

  async getMeta(key) {
    if (!this.db) return null;
    return new Promise((resolve) => {
      try {
        const tx = this.db.transaction('meta', 'readonly');
        const store = tx.objectStore('meta');
        const req = store.get(key);
        req.onsuccess = () => resolve(req.result ? req.result.value : null);
        req.onerror = () => resolve(null);
      } catch (e) { resolve(null); }
    });
  },

  async setMeta(key, value) {
    if (!this.db) return;
    return this.put('meta', { key, value });
  }
};

function getDeviceId() {
  let devId = null;
  try { devId = localStorage.getItem('salestrack_device_id'); } catch (e) {}
  if (!devId) {
    devId = 'pos_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 9);
    try { localStorage.setItem('salestrack_device_id', devId); } catch (e) {}
  }
  return devId;
}

async function enqueueOperation(type, payload) {
  const op = {
    id: 'op_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 9),
    deviceId: getDeviceId(),
    type,
    payload,
    createdAt: Date.now(),
    status: 'pending',
    attempts: 0
  };
  await localDb.put('outbox', op);
  if (typeof syncEngine !== 'undefined' && syncEngine.kick) {
    syncEngine.kick();
  }
  return op;
}

// ── CROSS-PANEL BROADCAST CHANNEL ─────────────────────────────────────────
const catalogChannel = (typeof window !== 'undefined' && 'BroadcastChannel' in window)
  ? new BroadcastChannel('salestrack_channel')
  : null;

function notifyCatalog(type, data = {}) {
  if (catalogChannel) {
    try {
      catalogChannel.postMessage({ type, timestamp: Date.now(), ...data });
    } catch (e) {
      console.warn('[pos channel] Broadcast failed:', e);
    }
  }
}

if (catalogChannel) {
  catalogChannel.onmessage = async (e) => {
    const { type, product } = e.data || {};
    if (type === 'PRODUCT_CREATED' || type === 'PRODUCT_UPDATED' || type === 'PRODUCT_DELETED' || type === 'CATALOG_CHANGED') {
      await loadProductsFromStorage();
      renderGrid();
      if (type === 'PRODUCT_CREATED' && product?.name) {
        showToast(`New product added: ${product.name}`, 'info');
      } else if (type === 'PRODUCT_UPDATED' && product?.name) {
        showToast(`Product updated: ${product.name}`, 'info');
      } else if (type === 'PRODUCT_DELETED') {
        showToast(`Product removed from catalog`, 'info');
      }
    }
  };
}

// ── BACKGROUND SYNC ENGINE ────────────────────────────────────────────────
const syncEngine = {
  isOnline: navigator.onLine,
  syncing: false,
  retryTimer: null,
  attempts: 0,

  async updateUI() {
    const pill = document.getElementById('posSyncPill');
    const label = document.getElementById('posSyncLabel');
    if (!pill || !label) return;

    const allOps = await localDb.getAll('outbox');
    const pending = allOps.filter(o => o.status === 'pending' || o.status === 'syncing');
    const failed = allOps.filter(o => o.status === 'failed' || o.status === 'conflict');

    pill.className = 'sync-pill';
    if (failed.length > 0) {
      pill.classList.add('sync-alert');
      label.textContent = `⚠️ ${failed.length} sync issue${failed.length > 1 ? 's' : ''}`;
    } else if (!this.isOnline) {
      pill.classList.add('offline');
      label.textContent = pending.length > 0
        ? `🔴 Offline (${pending.length})`
        : '🔴 Offline';
    } else if (this.syncing || pending.length > 0) {
      pill.classList.add('syncing');
      label.textContent = `🟡 Syncing (${pending.length})...`;
    } else {
      pill.classList.add('online-synced');
      label.textContent = '🟢 Synced';
    }
  },

  async kick() {
    if (this.syncing) return;
    clearTimeout(this.retryTimer);
    this.syncing = true;
    await this.updateUI();

    try {
      const isReachable = await this.probeConnectivity();
      if (!isReachable) {
        this.syncing = false;
        await this.updateUI();
        this.scheduleRetry();
        return;
      }

      await this.pushOutbox();
      await this.pullChanges();
      this.attempts = 0;
    } catch (err) {
      console.warn('[pos sync] Error:', err);
      this.scheduleRetry();
    } finally {
      this.syncing = false;
      await this.updateUI();
    }
  },

  async probeConnectivity() {
    if (!navigator.onLine) {
      this.isOnline = false;
      return false;
    }
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);
      const res = await fetch(`${API_BASE_URL}/health`, { cache: 'no-store', signal: controller.signal });
      clearTimeout(timeoutId);
      this.isOnline = res.ok;
      return res.ok;
    } catch (e) {
      this.isOnline = false;
      return false;
    }
  },

  async pushOutbox() {
    const allOps = await localDb.getAll('outbox');
    const pending = allOps.filter(o => o.status === 'pending');
    if (pending.length === 0) return;

    const batch = pending.slice(0, 50);
    for (const op of batch) {
      op.status = 'syncing';
      await localDb.put('outbox', op);
    }
    await this.updateUI();

    const res = await fetch(`${API_BASE_URL}/sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        deviceId: getDeviceId(),
        operations: batch
      })
    });

    if (!res.ok) throw new Error(`Sync error ${res.status}`);

    const data = await res.json();
    const accepted = new Set(data.accepted || []);
    const rejectedMap = new Map((data.rejected || []).map(r => [r.id, r]));

    for (const op of batch) {
      if (accepted.has(op.id)) {
        await localDb.delete('outbox', op.id);
      } else if (rejectedMap.has(op.id)) {
        const rej = rejectedMap.get(op.id);
        op.status = 'failed';
        op.errorCode = rej.code || 'REJECTED';
        op.errorMessage = rej.message || 'Rejected by server';
        await localDb.put('outbox', op);

        if (op.type === 'SALE' && rej.code === 'INSUFFICIENT_STOCK') {
          const prodId = op.payload?.productId;
          const saleQty = Number(op.payload?.quantity) || 0;
          const prod = products.find(p => p.id === prodId);
          if (prod && prod.stock !== null && prod.stock !== undefined) {
            prod.stock += saleQty;
            await localDb.put('products', { ...prod, quantity: prod.stock });
            updateCardStock(prod.id);
          }
          showToast(`🚨 Sale rejected: Insufficient stock on server.`, 'error', 7000);
        }
      } else {
        op.status = 'pending';
        await localDb.put('outbox', op);
      }
    }
  },

  async pullChanges() {
    const lastSyncSeq = (await localDb.getMeta('lastSyncSeq')) || 0;
    const res = await fetch(`${API_BASE_URL}/sync?since=${lastSyncSeq}`, { cache: 'no-store' });
    if (!res.ok) return;

    const data = await res.json();
    if (data.requiresBootstrap) {
      const snapRes = await fetch(`${API_BASE_URL}/data`, { cache: 'no-store' });
      if (snapRes.ok) {
        const snap = await snapRes.json();
        if (Array.isArray(snap.products)) {
          await localDb.putAll('products', snap.products);
          await localDb.setMeta('lastSyncSeq', snap.currentSeq || 0);
          await loadProductsFromStorage();
          renderGrid();
        }
      }
      return;
    }

    if (Array.isArray(data.changes) && data.changes.length > 0) {
      let modified = false;
      for (const ch of data.changes) {
        if (ch.entityType === 'product') {
          if (ch.action === 'DELETE' || ch.data?.isDeleted) {
            await localDb.delete('products', ch.entityId);
            modified = true;
          } else if (ch.data) {
            const allProds = await localDb.getAll('products');
            const existing = allProds.find(p => p.id === ch.entityId);
            const merged = existing ? { ...existing, ...ch.data } : ch.data;
            await localDb.put('products', merged);
            modified = true;
          }
        }
      }
      await localDb.setMeta('lastSyncSeq', data.currentSeq || 0);
      if (modified) {
        await loadProductsFromStorage();
        renderGrid();
      }
    }
  },

  scheduleRetry() {
    clearTimeout(this.retryTimer);
    this.attempts++;
    const base = Math.min(60000, 1000 * Math.pow(1.8, Math.min(this.attempts, 7)));
    const jitter = Math.floor(Math.random() * 1500);
    this.retryTimer = setTimeout(() => this.kick(), base + jitter);
  }
};

// ── STATE ─────────────────────────────────────────────────────────────────
let products = [];
let sessions = { sales: 0, revenue: 0, extraProfit: 0 };
let activeProduct = null;
let confirmLock = false;
let searchVal = '';
let filterVal = 'all';

async function loadProductsFromStorage() {
  const dbProds = await localDb.getAll('products');
  products = dbProds.map(p => ({
    id: p.id,
    name: p.name,
    sku: p.sku || ('SKU-' + (p.id ? p.id.slice(-6).toUpperCase() : '000000')),
    price: Number(p.price) || 0,
    stock: (p.quantity !== undefined && p.quantity !== null && p.quantity !== '') ? Number(p.quantity) : null,
    image: p.image || p.img || null,
    sold: Number(p.sold) || 0,
    notes: p.notes || '',
    version: p.version || 1
  }));
}

// ── RENDER ────────────────────────────────────────────────────────────────
function fmt(n) {
  return '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function renderCard(p) {
  const isUntracked = p.stock === null || p.stock === undefined;
  const isOut = !isUntracked && p.stock === 0;
  const isLow = !isUntracked && p.stock > 0 && p.stock <= 3;
  const badge = isOut ? 'out' : isLow ? 'low' : null;

  const badgeMap = {
    low: '<span class="card-badge badge-low">Low stock</span>',
    out: '<span class="card-badge badge-out">Out of stock</span>',
    new: '<span class="card-badge badge-new">New</span>'
  };

  const imgSrc = p.image || 'assets/logo.webp';

  return `
    <div class="pos-card ${isOut ? 'out-of-stock' : ''}" id="card-${p.id}">
      <div class="sync-indicator" id="sync-${p.id}"></div>
      <div class="pos-card-img-wrap">
        <img src="${imgSrc}" alt="${escapeHtml(p.name)}" class="pos-card-img" loading="lazy" onerror="this.onerror=null;this.src='assets/logo.webp';">
        ${badge ? badgeMap[badge] || '' : ''}
      </div>
      <div class="pos-card-body">
        <div class="pos-card-name">${escapeHtml(p.name)}</div>
        <div class="pos-card-sku">SKU: ${escapeHtml(p.sku)}</div>
        <div class="pos-card-price-row">
          <div class="pos-card-price">${fmt(p.price)}</div>
          <div class="pos-card-stock ${isUntracked ? 'stock-untracked' : isOut ? 'stock-out' : isLow ? 'stock-low' : ''}">
            <span class="stock-num" id="stock-${p.id}">${isUntracked ? '—' : p.stock}</span>
            ${isUntracked ? 'untracked' : 'in stock'}
          </div>
        </div>
      </div>
      <div class="pos-card-footer">
        <button class="sold-btn" onclick="openModal('${p.id}')" ${isOut ? 'disabled' : ''}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Record Sale
        </button>
      </div>
    </div>`;
}

function renderGrid() {
  const q = searchVal.toLowerCase();
  let visible = products.filter(p => {
    const matchSearch = !q || p.name.toLowerCase().includes(q) || (p.sku && p.sku.toLowerCase().includes(q));
    const isUntracked = p.stock === null || p.stock === undefined;
    const matchFilter = filterVal === 'all' ||
      (filterVal === 'in-stock' && (isUntracked || p.stock > 0)) ||
      (filterVal === 'low' && !isUntracked && p.stock > 0 && p.stock <= 3);
    return matchSearch && matchFilter;
  });

  const grid = document.getElementById('product-grid');
  const count = document.getElementById('product-count');
  count.textContent = `${visible.length} product${visible.length !== 1 ? 's' : ''}`;

  if (!products.length) {
    grid.innerHTML = `
      <div class="pos-empty">
        <div class="pos-empty-icon">📦</div>
        <div class="pos-empty-title">No products in catalog</div>
        <div class="pos-empty-sub">Create your first products in the Admin Panel to start selling.</div>
        <a href="https://admin.caretrack.website" target="_blank" rel="noopener" class="pos-empty-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Open Admin Panel
        </a>
      </div>`;
    return;
  }

  if (!visible.length) {
    grid.innerHTML = `
      <div class="pos-empty">
        <div class="pos-empty-icon">⌕</div>
        <div class="pos-empty-title">No matching products</div>
        <div class="pos-empty-sub">Try adjusting your keyword or filter criteria.</div>
      </div>`;
    return;
  }
  grid.innerHTML = visible.map(renderCard).join('');
}

function updateCardStock(productId) {
  const p = products.find(x => x.id === productId);
  if (!p) return;
  const isUntracked = p.stock === null || p.stock === undefined;
  const card = document.getElementById(`card-${p.id}`);
  const stockEl = document.getElementById(`stock-${p.id}`);
  if (stockEl) stockEl.textContent = isUntracked ? '—' : p.stock;
  if (card) {
    const stockContainer = card.querySelector('.pos-card-stock');
    if (stockContainer) {
      stockContainer.className = `pos-card-stock ${isUntracked ? 'stock-untracked' : p.stock === 0 ? 'stock-out' : (p.stock <= 3 ? 'stock-low' : '')}`;
      stockContainer.innerHTML = `<span class="stock-num" id="stock-${p.id}">${isUntracked ? '—' : p.stock}</span>${isUntracked ? 'untracked' : 'in stock'}`;
    }
    const btn = card.querySelector('.sold-btn');
    if (!isUntracked && p.stock === 0) {
      card.classList.add('out-of-stock');
      if (btn) btn.disabled = true;
    }
  }
}

// ── MODAL ─────────────────────────────────────────────────────────────────
function openModal(productId) {
  activeProduct = products.find(p => p.id === productId);
  const isUntracked = activeProduct && (activeProduct.stock === null || activeProduct.stock === undefined);
  if (!activeProduct || (!isUntracked && activeProduct.stock === 0)) return;

  document.getElementById('modal-sku').textContent = `${activeProduct.name}${activeProduct.sku ? ` · SKU: ${activeProduct.sku}` : ''}`;
  document.getElementById('qty-input').value = 1;
  document.getElementById('price-input').value = activeProduct.price.toFixed(2);

  updateSummary();
  validateQty();

  const overlay = document.getElementById('overlay');
  overlay.classList.add('open');
  setTimeout(() => document.getElementById('price-input').select(), 60);
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  activeProduct = null;
  confirmLock = false;
  document.getElementById('btn-confirm').disabled = false;
  document.getElementById('btn-confirm').textContent = 'Confirm Sale';
}

// ── SUMMARY CALC ──────────────────────────────────────────────────────────
function updateSummary() {
  if (!activeProduct) return;
  const qty   = parseInt(document.getElementById('qty-input').value) || 1;
  const price = parseFloat(document.getElementById('price-input').value);
  const base  = activeProduct.price;

  document.getElementById('sum-base').textContent = fmt(base);
  document.getElementById('sum-base-total').textContent = fmt(base * qty);
  document.getElementById('sum-sell').textContent = isNaN(price) ? '—' : fmt(price);
  document.getElementById('sum-sell-total').textContent = isNaN(price) ? '—' : fmt(price * qty);

  const profitRow = document.getElementById('sum-profit-row');
  const profitLbl = document.getElementById('sum-profit-label');
  const profitVal = document.getElementById('sum-profit-val');

  if (isNaN(price)) {
    profitRow.className = 'summary-profit even';
    profitLbl.textContent = 'Enter a selling price';
    profitVal.textContent = '—';
    return;
  }

  const diff = price - base;
  const total = diff * qty;

  if (Math.abs(diff) < 0.001) {
    profitRow.className = 'summary-profit even';
    profitLbl.textContent = 'At base catalog price';
    profitVal.textContent = '$0.00';
  } else if (diff > 0) {
    profitRow.className = 'summary-profit profit';
    profitLbl.textContent = `Extra profit`;
    profitVal.textContent = `+${fmt(total)}`;
  } else {
    profitRow.className = 'summary-profit discount';
    profitLbl.textContent = `Discount / reduction`;
    profitVal.textContent = `−${fmt(Math.abs(total))}`;
  }
}

function validateQty() {
  if (!activeProduct) return true;
  const qty = parseInt(document.getElementById('qty-input').value) || 0;
  const warn = document.getElementById('qty-warn');
  const ctrl = document.getElementById('qty-control');
  const maxLbl = document.getElementById('qty-max-label');
  const isUntracked = activeProduct.stock === null || activeProduct.stock === undefined;

  if (!isUntracked && qty > activeProduct.stock) {
    warn.classList.add('visible');
    ctrl.classList.add('error');
    maxLbl.textContent = activeProduct.stock;
    return false;
  } else {
    warn.classList.remove('visible');
    ctrl.classList.remove('error');
    return true;
  }
}

// ── QTY CONTROLS ──────────────────────────────────────────────────────────
document.getElementById('qty-dec').addEventListener('click', () => {
  const inp = document.getElementById('qty-input');
  const v = parseInt(inp.value) || 1;
  if (v > 1) { inp.value = v - 1; updateSummary(); validateQty(); }
});
document.getElementById('qty-inc').addEventListener('click', () => {
  const inp = document.getElementById('qty-input');
  const v = parseInt(inp.value) || 1;
  const isUntracked = !activeProduct || activeProduct.stock === null || activeProduct.stock === undefined;
  if (isUntracked || v < activeProduct.stock) {
    inp.value = v + 1; updateSummary(); validateQty();
  }
});
document.getElementById('qty-input').addEventListener('input', () => {
  updateSummary(); validateQty();
});
document.getElementById('price-input').addEventListener('input', () => {
  updateSummary();
});

// ── CONFIRM SALE ──────────────────────────────────────────────────────────
document.getElementById('btn-confirm').addEventListener('click', async () => {
  if (confirmLock || !activeProduct) return;

  const qty   = parseInt(document.getElementById('qty-input').value) || 0;
  const price = parseFloat(document.getElementById('price-input').value);
  const p     = activeProduct;
  const isUntracked = p.stock === null || p.stock === undefined;

  // Validate
  if (qty < 1) { showToast('Enter a valid quantity.', 'warn'); return; }
  if (!isUntracked && qty > p.stock) { showToast(`Only ${p.stock} items in stock.`, 'warn'); return; }
  if (isNaN(price) || price <= 0) { showToast('Enter a valid selling price.', 'warn'); return; }

  confirmLock = true;
  document.getElementById('btn-confirm').disabled = true;
  document.getElementById('btn-confirm').textContent = 'Saving…';

  // Transaction record (local session)
  const tx = {
    productId:      p.id,
    productName:    p.name,
    quantity:       qty,
    basePrice:      p.price,
    sellingPrice:   price,
    totalBaseValue: p.price * qty,
    totalSaleValue: price * qty,
    priceDiff:      (price - p.price) * qty,
    timestamp:      new Date().toISOString(),
    sellerId:       'seller-01',
    syncStatus:     'saved'
  };

  // Update local state immediately (preserve null if untracked)
  if (!isUntracked) {
    p.stock -= qty;
  }
  p.sold = (p.sold || 0) + qty;
  sessions.sales++;
  sessions.revenue += tx.totalSaleValue;
  sessions.extraProfit += tx.priceDiff > 0 ? tx.priceDiff : 0;

  // Persist updated product to local replica IndexedDB
  await localDb.put('products', {
    id: p.id,
    name: p.name,
    sku: p.sku,
    price: p.price,
    quantity: p.stock,
    sold: p.sold,
    image: p.image,
    notes: p.notes,
    version: (p.version || 1) + 1,
    updatedAt: Date.now()
  });

  // Save activity record to IndexedDB
  const activityId = 'act_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 7);
  await localDb.put('activities', {
    id: activityId,
    type: 'sale',
    timestamp: Date.now(),
    productId: p.id,
    productName: p.name,
    quantity: qty,
    sellingPrice: price,
    totalSaleValue: tx.totalSaleValue,
    priceDiff: tx.priceDiff,
    notes: `POS sale (${qty}x @ $${price.toFixed(2)})`
  });

  // Enqueue SALE operation for PostgreSQL sync engine
  await enqueueOperation('SALE', {
    productId: p.id,
    quantity: qty,
    sellingPrice: price,
    notes: `POS sale: ${qty}x @ $${price.toFixed(2)}`,
    timestamp: Date.now(),
    activityId
  });

  // Broadcast sale to open Admin tabs
  notifyCatalog('SALE_RECORDED', {
    productId: p.id,
    productName: p.name,
    quantity: qty,
    price: price,
    total: tx.totalSaleValue
  });

  // Update header stats
  document.getElementById('hdr-sales').textContent = sessions.sales;
  document.getElementById('hdr-revenue').textContent = fmt(sessions.revenue);
  document.getElementById('hdr-profit').textContent = `+${fmt(sessions.extraProfit)}`;

  updateCardStock(p.id);
  closeModal();

  // Show sync indicator
  showSync(p.id, 'synced');

  // Build toast detail
  const diff = tx.priceDiff;
  const profitLine = Math.abs(diff) < 0.01 ? 'Sold at catalog price' :
    diff > 0 ? `Extra profit: +${fmt(diff)}` : `Discount: −${fmt(Math.abs(diff))}`;

  showToast(`${p.name} × ${qty} · Sold for ${fmt(price * qty)}`, 'success', profitLine);
});

// ── SYNC INDICATOR ────────────────────────────────────────────────────────
function showSync(productId, status) {
  const el = document.getElementById(`sync-${productId}`);
  if (!el) return;
  el.className = 'sync-indicator visible sync-' + status;
  const icons = { saved: '✓ Saved', syncing: '⟳ Syncing', synced: '✓ Synced', failed: '⚠ Sync failed' };
  el.textContent = icons[status] || '';
  if (status === 'synced') {
    setTimeout(() => el.classList.remove('visible'), 3000);
  }
}

// ── TOAST ─────────────────────────────────────────────────────────────────
function showToast(message, type = 'success', detail = '') {
  const container = document.getElementById('toasts');
  const iconMap = { success: '✓', warn: '⚠', error: '✕', info: 'ℹ' };
  const classMap = { success: 'profit-toast', warn: 'warn-toast', error: 'error-toast', info: '' };

  const t = document.createElement('div');
  t.className = `pos-toast ${classMap[type] || ''}`;
  t.innerHTML = `
    <span class="toast-icon">${iconMap[type] || '✓'}</span>
    <div class="toast-body">
      <div class="toast-title">${message}</div>
      ${detail ? `<div class="toast-detail">${detail}</div>` : ''}
    </div>`;
  container.appendChild(t);
  setTimeout(() => {
    t.style.opacity = '0';
    t.style.transform = 'translateX(20px)';
    t.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
    setTimeout(() => t.remove(), 250);
  }, 4500);
}

// ── CLOSE / CANCEL ────────────────────────────────────────────────────────
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('btn-cancel').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ── SEARCH & FILTER ───────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchVal = e.target.value;
  renderGrid();
});
document.querySelectorAll('.pos-filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pos-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterVal = btn.dataset.filter;
    renderGrid();
  });
});

// ── THEME TOGGLE ──────────────────────────────────────────────────────────
const themeBtn = document.getElementById('themeToggle');
if (themeBtn) {
  themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try {
      localStorage.setItem('salestrack-theme', next);
    } catch (e) {}
  });
}

if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const listener = (e) => {
    if (!localStorage.getItem('salestrack-theme')) {
      document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
    }
  };
  if (mq.addEventListener) mq.addEventListener('change', listener);
  else if (mq.addListener) mq.addListener(listener);
}

// ── INITIALIZATION ────────────────────────────────────────────────────────
async function init() {
  await localDb.init();
  await loadProductsFromStorage();
  renderGrid();

  // Hydrate session stats from today's activities
  try {
    const todayStart = new Date().setHours(0, 0, 0, 0);
    const acts = await localDb.getAll('activities');
    const todaySales = acts.filter(a => a.type === 'sale' && a.timestamp >= todayStart);
    sessions.sales = todaySales.length;
    sessions.revenue = todaySales.reduce((acc, a) => acc + (Number(a.totalSaleValue) || (Number(a.sellingPrice || 0) * (a.quantity || 1))), 0);
    sessions.extraProfit = todaySales.reduce((acc, a) => acc + (Math.max(0, Number(a.priceDiff) || 0)), 0);
    document.getElementById('hdr-sales').textContent = sessions.sales;
    document.getElementById('hdr-revenue').textContent = fmt(sessions.revenue);
    document.getElementById('hdr-profit').textContent = `+${fmt(sessions.extraProfit)}`;
  } catch (e) {
    console.warn('[pos stats] Failed to hydrate session stats:', e);
  }

  syncEngine.updateUI();

  // Network and window listeners
  window.addEventListener('online', () => {
    syncEngine.isOnline = true;
    syncEngine.kick();
  });
  window.addEventListener('offline', () => {
    syncEngine.isOnline = false;
    syncEngine.updateUI();
  });
  window.addEventListener('focus', () => {
    loadProductsFromStorage().then(renderGrid);
    syncEngine.kick();
  });

  // Start background sync
  syncEngine.kick();
  setInterval(() => syncEngine.kick(), 25000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
